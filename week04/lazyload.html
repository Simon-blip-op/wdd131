<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Images</title>

    <link rel="stylesheet" href="styles/lazyload.css">
</head>

<body>

    <main>
        <h1>Lazy Loading Images</h1>

        <img src="https://picsum.photos/400/600?random=1"
            alt="Mountain landscape"
            loading="lazy"
            width="400"
            height="600">

        <img src="https://picsum.photos/400/600?random=2"
            alt="Forest path"
            loading="lazy"
            width="400"
            height="600">

        <img src="https://picsum.photos/400/600?random=3"
            alt="River flowing through trees"
            loading="lazy"
            width="400"
            height="600">

        <img src="https://picsum.photos/400/600?random=4"
            alt="Sunset over the hills"
            loading="lazy"
            width="400"
            height="600">

        <img src="https://picsum.photos/400/600?random=5"
            alt="Waterfall in a forest"
            loading="lazy"
            width="400"
            height="600">

        <img src="https://picsum.photos/400/600?random=6"
            alt="Lake surrounded by mountains"
            loading="lazy"
            width="400"
            height="600">
    </main>

    <footer>
        <p>
            Last Modified:
            <span id="lastModified"></span>
        </p>
    </footer>

    <script src="scripts/lazyload.js"></script>

</body>
</html>
