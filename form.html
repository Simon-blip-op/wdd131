<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>
    <form method="get" action="review.html">

        <label for="product">Product Name *</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
        </select>

        <fieldset>
            <legend>Overall Rating *</legend>

            <label><input type="radio" name="rating" value="1" required> ☆</label>
            <label><input type="radio" name="rating" value="2" required> ☆☆</label>
            <label><input type="radio" name="rating" value="3" required> ☆☆☆</label>
            <label><input type="radio" name="rating" value="4" required> ☆☆☆☆</label>
            <label><input type="radio" name="rating" value="5" required> ☆☆☆☆☆</label>
        </fieldset>

        <label for="installDate">Date of Installation *</label>
        <input type="date" id="installDate" name="installDate" required>

        <fieldset>
            <legend>Useful Features</legend>

            <label>
                <input type="checkbox" name="features" value="Durability">
                Durability
            </label>

            <label>
                <input type="checkbox" name="features" value="Ease of Use">
                Ease of Use
            </label>

            <label>
                <input type="checkbox" name="features" value="Performance">
                Performance
            </label>

            <label>
                <input type="checkbox" name="features" value="Design">
                Design
            </label>
        </fieldset>

        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="5"></textarea>

        <label for="username">User Name</label>
        <input type="text" id="username" name="username">

        <input type="submit" value="Submit Review">

    </form>
</main>

<footer>

    <p>
        © <span id="currentyear"></span>
        🌸 Simon Banda 🌸 South Africa
    </p>

    <p id="lastModified"></p>

</footer>

</body>
</html>
