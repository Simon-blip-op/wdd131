<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>South Africa</title>
    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>South Africa</h1>
    </header>

    <main>

        <picture>
            <source srcset="images/hero-large.webp" media="(min-width: 768px)">
            <img src="images/landscapes.webp" alt="South Africa">
        </picture>

        <section class="data">
            <h2>Data</h2>

            <p><strong>Capital:</strong> Pretoria</p>
            <p><strong>Population:</strong> 62 Million</p>
            <p><strong>Language:</strong> 11 Official Languages</p>
            <p><strong>Currency:</strong> Rand</p>
            <p><strong>Area:</strong> 1.22 million km²</p>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <img src="images/weather.svg" alt="Weather Icon" class="weather-icon">

            <p><strong>Temperature:</strong> <span id="temperature">8</span>°C</p>

            <p><strong>Wind Speed:</strong> <span id="windSpeed">10</span> km/h</p>

            <p><strong>Conditions:</strong> Cloudy</p>

            <p><strong>Wind Chill:</strong> <span id="windChill"></span></p>

        </section>

    </main>
    
    <footer>

        <p>
            © <span id="currentyear"></span>
            🌸 Simon Banda 🌸 South Africa
        </p>

        <p id="lastModified"></p>

    </footer>

</body>
</html>
